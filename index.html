<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sacola — lista de compras</title>
  <meta name="description" content="Lista de compras com corredores, orçamento e cálculo de carrinho, que funciona sem internet.">

  <meta name="theme-color" content="#1B4E9B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sacola">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="topo">
      <div class="topo__linha">
        <h1 class="topo__titulo">Sacola</h1>
        <button type="button" class="topo__corredores" id="botao-corredores" aria-expanded="false" aria-controls="painel-corredores">
          Corredores
        </button>
      </div>
      <p class="topo__contagem" id="contagem" aria-live="polite">Nada na sacola ainda</p>

      <section class="painel-financeiro" id="painel-financeiro" aria-live="polite">
        <div class="painel-financeiro__linha">
          <span class="painel-financeiro__rotulo">Total</span>
          <strong class="painel-financeiro__valor" data-total>R$ 0,00</strong>
        </div>
        <div class="painel-financeiro__linha" data-linha-saldo hidden>
          <span class="painel-financeiro__rotulo">Saldo</span>
          <strong class="painel-financeiro__valor" data-saldo>—</strong>
        </div>
        <div class="painel-financeiro__linha painel-financeiro__linha--orcamento">
          <label class="painel-financeiro__rotulo" for="campo-orcamento">Orçamento</label>
          <input
            class="painel-financeiro__campo"
            id="campo-orcamento"
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="Sem limite">
        </div>
        <p class="painel-financeiro__badge" data-badge hidden></p>
      </section>

      <div class="corredores" id="painel-corredores" hidden></div>
    </header>

    <main class="conteudo">
      <h2 class="oculto">Itens da lista</h2>

      <p class="vazio" id="vazio">
        Escreva o primeiro item aí embaixo — arroz, café, papel-toalha.
      </p>

      <p class="vazio vazio--pendentes" id="vazio-pendentes" hidden>
        Tudo pendente foi comprado. Confira a seção de concluídos aqui embaixo.
      </p>

      <ul class="lista" id="lista" aria-label="Itens pendentes"></ul>

      <section class="concluidos" id="secao-concluidos" hidden>
        <div class="concluidos__cabecalho">
          <button type="button" class="concluidos__alternar" id="alternar-concluidos" aria-expanded="false" aria-controls="lista-concluidos">
            <span id="concluidos-titulo">Concluídos</span>
          </button>
          <button type="button" class="concluidos__limpar" id="limpar-concluidos">Limpar concluídos</button>
        </div>
        <ul class="lista lista--concluidos" id="lista-concluidos" aria-label="Itens concluídos" hidden></ul>
      </section>
    </main>

    <form class="barra" id="formulario" autocomplete="off">
      <div class="barra__linha barra__linha--principal">
        <label class="oculto" for="campo-nome">Nome do item</label>
        <input
          class="barra__campo barra__campo--nome"
          id="campo-nome"
          name="nome"
          type="text"
          placeholder="O que falta comprar?"
          maxlength="80"
          enterkeyhint="next"
          required>
        <button class="barra__botao" type="submit">Adicionar</button>
      </div>

      <div class="barra__linha barra__linha--detalhes">
        <label class="oculto" for="campo-quantidade">Quantidade</label>
        <input
          class="barra__campo barra__campo--quantidade"
          id="campo-quantidade"
          name="quantidade"
          type="number"
          min="0.01"
          step="any"
          inputmode="decimal"
          placeholder="1">

        <label class="oculto" for="campo-unidade">Unidade</label>
        <select class="barra__campo barra__campo--unidade" id="campo-unidade" name="unidade">
          <option value="un" selected>un</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="L">L</option>
          <option value="ml">ml</option>
          <option value="caixa">caixa</option>
          <option value="pacote">pacote</option>
        </select>

        <label class="oculto" for="campo-categoria">Categoria</label>
        <select class="barra__campo barra__campo--categoria" id="campo-categoria" name="categoria">
          <option value="hortifruti">Hortifrúti</option>
          <option value="padaria">Padaria</option>
          <option value="laticinios">Laticínios e frios</option>
          <option value="carnes">Carnes e peixes</option>
          <option value="mercearia" selected>Mercearia</option>
          <option value="bebidas">Bebidas</option>
          <option value="limpeza">Limpeza</option>
          <option value="higiene">Higiene e farmácia</option>
          <option value="outros">Outros</option>
        </select>

        <label class="oculto" for="campo-preco">Preço unitário</label>
        <input
          class="barra__campo barra__campo--preco"
          id="campo-preco"
          name="preco"
          type="number"
          min="0"
          step="0.01"
          inputmode="decimal"
          placeholder="Preço un.">
      </div>
    </form>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__mensagem" id="toast-mensagem">Itens removidos da lista</span>
    <button type="button" class="toast__desfazer" id="toast-desfazer" hidden>DESFAZER</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
